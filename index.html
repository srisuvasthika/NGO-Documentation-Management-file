<style>

/* ================= GENERAL ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #26332b;
    background: #f7faf8;
    line-height: 1.7;
}

a {
    text-decoration: none;
}

.container {
    max-width: 1200px;
    margin: auto;
}

section {
    padding: 80px 25px;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
}

.section-title h2 {
    font-size: 36px;
    color: #176b3a;
    margin-bottom: 10px;
}

.section-title p {
    color: #66736b;
    max-width: 700px;
    margin: auto;
}


/* ================= HEADER ================= */

header {
    background: white;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 15px rgba(0,0,0,0.08);
}

.navbar {
    max-width: 1200px;
    margin: auto;
    padding: 18px 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    width: 48px;
    height: 48px;

    background: #e8f5e9;
    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 25px;
}

.logo-text h2 {
    color: #176b3a;
    font-size: 21px;
}

.logo-text span {
    font-size: 12px;
    color: #68756d;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 25px;
}

nav a {
    color: #34443a;
    font-weight: 600;
    font-size: 14px;
}

nav a:hover {
    color: #16803c;
}


/* ================= HERO ================= */

.hero {
    min-height: 600px;

    display: flex;
    align-items: center;

    background:
        linear-gradient(
            rgba(20, 91, 50, 0.90),
            rgba(20, 91, 50, 0.90)
        ),
        linear-gradient(135deg, #dff3e5, #ffffff);

    color: white;
}

.hero-content {
    max-width: 1200px;
    width: 100%;
    margin: auto;
    padding: 80px 25px;
}

.hero-badge {
    display: inline-block;

    padding: 8px 18px;

    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 30px;

    margin-bottom: 25px;

    font-size: 14px;
}

.hero h1 {
    font-size: 55px;
    max-width: 750px;
    line-height: 1.15;
    margin-bottom: 25px;
}

.hero p {
    max-width: 680px;
    font-size: 19px;
    color: #e7f4ea;
    margin-bottom: 35px;
}

.hero-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    padding: 13px 25px;
    border-radius: 8px;
    font-weight: bold;
}

.btn-primary {
    background: white;
    color: #176b3a;
}

.btn-outline {
    border: 1px solid white;
    color: white;
}

.btn-outline:hover {
    background: white;
    color: #176b3a;
}


/* ================= ABOUT ================= */

.about {
    background: white;
}

.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
}

.about-card {
    padding: 35px;

    border-radius: 15px;

    background: #f5faf6;

    border: 1px solid #e2eee5;
}

.about-card h3 {
    color: #176b3a;
    margin-bottom: 15px;
    font-size: 23px;
}


/* ================= FOCUS AREAS ================= */

.focus-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 25px;
}

.focus-card {
    background: white;
    padding: 35px 28px;

    border-radius: 15px;

    box-shadow: 0 5px 20px rgba(0,0,0,0.07);

    text-align: center;

    transition: 0.3s;
}

.focus-card:hover {
    transform: translateY(-6px);
}

.focus-icon {
    font-size: 42px;
    margin-bottom: 15px;
}

.focus-card h3 {
    color: #176b3a;
    margin-bottom: 10px;
}


/* ================= IMPACT ================= */

.impact {
    background: #176b3a;
    color: white;
}

.impact .section-title h2 {
    color: white;
}

.impact .section-title p {
    color: #dceee1;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 20px;
}

.stat-card {
    text-align: center;

    padding: 30px 15px;

    border: 1px solid rgba(255,255,255,0.25);

    border-radius: 14px;
}

.stat-card h3 {
    font-size: 38px;
}

.stat-card p {
    color: #d9ede0;
}


/* ================= DOCUMENTS ================= */

.documents {
    background: #f7faf8;
}

    grid-template-columns: repeat(3,1fr);
    gap: 25px;

    color: #26332b;

    border: 1px solid #e0ebe3;

    transition: 0.3s;
}

.document-card:hover {
    transform: translateY(-6px);

    box-shadow:

}

.document-icon {
    font-size: 38px;
    margin-bottom: 15px;
}

.document-card h3 {
    color: #176b3a;
    margin-bottom: 10px;
}

.document-card span {
    display: inline-block;

    margin-top: 18px;

    color: #16803c;

    font-weight: bold;
}
